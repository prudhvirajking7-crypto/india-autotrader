[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "india-autotrader"
version = "0.1.0"
description = "Automated trading system for Indian stock markets (NSE/BSE) with TradingView webhook integration"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",

    # State / caching
    "redis>=5.0.4",
    "hiredis>=2.3.2",

    # Async HTTP
    "httpx>=0.27.0",

    # Scheduling
    "apscheduler>=3.10.4",

    # Indian broker SDKs
    "kiteconnect>=5.0.1",
    "upstox-python-sdk>=2.15.0",
    "smartapi-python>=1.5.1",

    # Market data
    "jugaad-data>=0.27",
    "nsepython>=3.1.16",
    "yfinance>=0.2.40",
    "pandas>=2.2.2",
    "numpy>=1.26.4",

    # Technical analysis
    "pandas-ta>=0.3.14b0",
    "ta-lib>=0.4.28",

    # Backtesting
    "vectorbt>=0.26.2",
    "quantstats>=0.0.62",

    # Notifications
    "python-telegram-bot>=21.3",

    # Utilities
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "pytz>=2024.1",
    "holidays>=0.46",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
# AI sentiment — FinBERT runs locally on CPU (~500MB download on first use)
# Install: pip install "india-autotrader[ai]"
ai = [
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "sentencepiece>=0.2.0",
]

dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

# Full install including AI
all = [
    "india-autotrader[ai]",
    "india-autotrader[dev]",
]

[project.scripts]
autotrader = "main:app"
backtest = "scripts.backtest:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=75"
